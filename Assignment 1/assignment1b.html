<!DOCTYPE html>
<head>
    <title>To-Do List</title>
    <link rel="stylesheet" href="assignment1b.css">
</head>
<body>
<div class="container">
    <h1>To-Do List</h1>
    <div class="form-top">
        <input type="text" placeholder="Teammate Name">
        <button class="btn add">Add</button>
    </div>
    <div class="form-bottom">
        <select>
            <option>Leo</option>
            <option>Laura</option>
            <option>Arnavi</option>
        </select>
        <input type="text" placeholder="Task">
        <input type="date" value="2099-09-01">
        <button class="btn assign">Assign</button>
    </div>

    <hr class="divider">
    <div class="tasks">
        <h2>Arnavi</h2>
        <div class="task">
            <span>Set up Flask server</span>
            <span class="due">Due: 2099-10-01</span>
            <input type="checkbox">
        </div>
        <div class="task">
            <span>Set up Git repo</span>
            <span class="due">Due: 2099-10-01</span>
            <input type="checkbox">
        </div>

        <h2>Laura</h2>
        <div class="task">
            <span>Draft weekly plan</span>
            <span class="due">Due: 2099-09-28</span>
            <input type="checkbox">
        </div>
        <h2>Leo</h2>
        <div class="task">
            <span>Survey existing apps</span>
            <span class="due">Due: 2099-09-28</span>
            <input type="checkbox">
        </div>
    </div>

    <hr class="divider">
    <div class="bottom-buttons">
        <button class="btn clear">Clear Completed</button>
        <button class="btn reset">Reset</button>
    </div>
</div>
</body>
</html>
